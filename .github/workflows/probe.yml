name: MapKit muid probe

# No Mac needed locally — this runs on a GitHub-hosted macOS runner.
# Trigger it by hand from the Actions tab and read the log.
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: swift --version

      - name: Run probe
        run: swift run -c release muidprobe
